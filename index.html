<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bolso</title>
<meta name="theme-color" content="#F2C200">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bolso">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header (marca + ano + abas dos meses) · mês em 2 colunas: lançamentos à esquerda, resumo fixo à direita */
:root{
  --paper:#F6F5EF; --surface:#FFFFFF; --ink:#15171C; --muted:#686A72; --line:#E3E1D8;
  --gold:#F2C200; --gold-soft:#FBF1C4; --on-gold:#15171C;
  --band:#15171C; --on-band:#FFFFFF;
  --pos:#1D7F47; --neg:#C2362C; --c-ess:#15171C; --c-var:#8C8E96; --c-ext:#E08A1E;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1013; --surface:#17191E; --ink:#ECEBE5; --muted:#9B9DA4; --line:#2A2C33;
  --gold:#F5C518; --gold-soft:#3A3213; --on-gold:#15171C; --band:#24262D; --on-band:#FFFFFF;
  --pos:#4CC27E; --neg:#F0675B; --c-ess:#ECEBE5; --c-var:#6E7079; --c-ext:#F0A040; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1013; --surface:#17191E; --ink:#ECEBE5; --muted:#9B9DA4; --line:#2A2C33;
  --gold:#F5C518; --gold-soft:#3A3213; --on-gold:#15171C; --band:#24262D; --on-band:#FFFFFF;
  --pos:#4CC27E; --neg:#F0675B; --c-ess:#ECEBE5; --c-var:#6E7079; --c-ext:#F0A040; color-scheme:dark }

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.brand .mark{width:34px;height:34px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;border-radius:6px;font-size:22px}
.brand b{color:var(--gold)}
.year{display:flex;align-items:center;gap:4px;margin-left:auto}
.year button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.year button:hover{border-color:var(--ink)}
.year span{font-family:var(--display);font-weight:800;font-size:20px;min-width:64px;text-align:center}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status[data-s="saved"] i{background:var(--pos)} .status[data-s="saving"] i{background:var(--gold)} .status[data-s="error"] i{background:var(--neg)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 12px;text-align:left;min-width:74px}
.tab:hover{background:var(--paper)}
.tab .n{display:block;font-weight:600;font-size:14px}
.tab .v{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tab .v.pos{color:var(--pos)} .tab .v.neg{color:var(--neg)}
.tab[aria-current="true"]{background:var(--gold);color:var(--on-gold)}
.tab[aria-current="true"] .v{color:var(--on-gold);opacity:.75}
.tab.overview{border-color:var(--line);margin-right:6px}
.tab.now .n::after{content:"•";margin-left:4px;color:var(--gold)}
.tab[aria-current="true"].now .n::after{color:var(--on-gold)}

main{padding-block:24px 64px}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:14px}

/* Month layout */
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.mhead h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;margin:0;line-height:1;text-wrap:balance}
.mhead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)} aside{order:-1}}
.col{display:grid;gap:22px;min-width:0}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--band);color:var(--on-band)}
.sec-h h2{margin:0;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.01em;text-transform:uppercase}
.sec-h small{display:block;font-size:12px;opacity:.7;font-weight:400;text-transform:none;letter-spacing:0;font-family:var(--body)}
.sec-h .tot{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:17px;white-space:nowrap}
.sec.extras .sec-h{background:var(--gold);color:var(--on-gold)}
.cols{display:grid;gap:8px;padding:8px 16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
.row{display:grid;gap:8px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.g-income{grid-template-columns:minmax(0,1fr) 150px 32px}
.g-bill{grid-template-columns:28px minmax(0,1fr) 62px 150px 32px}
.g-extra{grid-template-columns:118px minmax(0,1fr) 128px 150px 32px}
.row input,.row select{width:100%;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:7px 8px}
.row input:hover,.row select:hover{border-color:var(--line)}
.row input:focus,.row select:focus{border-color:var(--gold);background:var(--paper);outline:none}
.money{position:relative}
.money::before{content:"$";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.money input{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-left:22px}
.row input.due{text-align:center;font-family:var(--mono)}
.chk{appearance:none;width:22px!important;height:22px;border:2px solid var(--line)!important;border-radius:6px!important;padding:0!important;display:grid;place-items:center;cursor:pointer;background:var(--surface)!important}
.chk:checked{background:var(--pos)!important;border-color:var(--pos)!important}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row.paid input.desc{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.del{width:30px;height:30px;border:0;background:transparent;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.del:hover{background:var(--paper);color:var(--neg)}
.add{display:flex;align-items:center;gap:6px;width:100%;border:0;border-top:1px dashed var(--line);background:transparent;padding:11px 16px;color:var(--muted);font-weight:600;font-size:14px;text-align:left}
.add:hover{color:var(--ink);background:var(--paper)}
.empty-row{padding:16px;color:var(--muted);font-size:14px}
@media (max-width:600px){
  .cols{display:none}
  .g-income{grid-template-columns:minmax(0,1fr) 120px 30px}
  .g-bill{grid-template-columns:26px minmax(0,1fr) 120px 30px}
  .g-bill .due{display:none}
  .g-extra{grid-template-columns:minmax(0,1fr) 120px 30px;row-gap:2px}
  .g-extra .xdate{grid-column:1;grid-row:2} .g-extra .xcat{grid-column:2/4;grid-row:2}
  .row{padding:6px 10px}
}

/* Aside */
aside{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px);min-width:0}
@media (max-width:900px){aside{position:static}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--mono);font-weight:600;font-size:32px;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.balance{background:var(--band);color:var(--on-band);border:0}
.balance .lbl{color:var(--on-band);opacity:.65}
.balance .pos{color:#6BE09A} .balance .neg{color:#FF8A7F}
.kv{display:grid;gap:8px;margin-top:12px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:10px}
.kv span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:12px}
.stack span{height:100%;transition:width .3s}
.legend{display:grid;gap:6px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:var(--mono);font-weight:500}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.meter span{display:block;height:100%;background:var(--pos);transition:width .3s}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px;resize:vertical;margin-top:8px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--neg)}
.btn.danger.solid{background:var(--neg);border-color:var(--neg);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.startbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,40px);max-width:640px}
.startbox h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 8px;letter-spacing:-.02em}
.startbox p{color:var(--muted);margin:0 0 20px}
.choices{display:grid;gap:10px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:14px 16px}
.choice:hover{border-color:var(--ink)}
.choice strong{font-size:15px} .choice span{font-size:13px;color:var(--muted)}
.choice.rec{border-color:var(--gold);background:var(--gold-soft)}

/* Year */
.ycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart .gl{stroke:var(--line)} .chart .tx{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .bi{fill:var(--gold)} .chart .be{fill:var(--c-ess)}
.chart .mx{fill:var(--ink);font-family:var(--body);font-size:12px;font-weight:600}
.tablewrap{overflow-x:auto;margin-top:22px}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--paper)}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
td:first-child{font-family:var(--body);font-weight:600}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--paper)}
tr.nodata td{color:var(--muted);font-weight:400}
tfoot td{font-weight:600;background:var(--gold-soft);border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.loading{color:var(--muted);padding:40px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn svg{vertical-align:-2px;margin-right:4px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ok{background:var(--pos);border-color:var(--pos);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--band);color:var(--on-band);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.who{order:5;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);min-width:0}
.who span{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--neg);background:var(--surface);color:var(--neg);border-radius:10px;font-size:15px;font-weight:600;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.logout:hover,.logout:active{background:var(--neg);color:#fff}
.logout:disabled{opacity:.6;cursor:wait}
.auth{max-width:420px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.auth h1{font-family:var(--display);font-weight:800;font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.auth p{color:var(--muted);margin:0 0 20px;font-size:14px}
.auth label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.auth input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:11px 12px;font-size:16px}
.auth input:focus{outline:none;border-color:var(--gold)}
.pw{position:relative}
.pw input{padding-right:48px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.eye:hover{color:var(--ink);background:var(--line)}
.auth .btn{width:100%;margin-top:18px;padding:12px}
.auth .switch{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline}
.auth .msg{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--gold-soft)}
.auth .msg.err{background:transparent;border:1px solid var(--neg);color:var(--neg)}
.auth code{font-family:var(--mono);font-size:13px;background:var(--paper);padding:2px 5px;border-radius:4px}
@media (max-width:600px){
  .brand{font-size:22px}
  /* Celular: marca + Sair na 1ª linha, ano + status na 2ª */
  .top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand who" "year status";gap:10px 12px}
  .brand{grid-area:brand}
  .who{grid-area:who;justify-self:end}
  .who span{display:none}
  .year{grid-area:year;margin-left:0;justify-self:start}
  .year button{width:44px;height:44px}
  .status{grid-area:status;justify-self:end;text-align:right}
  .mhead{align-items:stretch}
  .actions{width:100%}
  .actions .btn{flex:1 1 auto;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><span class="mark">B</span><span>BOL<b>SO</b></span></div>
      <div class="status" id="status" data-s="loading"><i></i><span>Conectando ao banco…</span></div>
      <div class="who" id="who" hidden><span id="whoEmail"></span><button id="logout" class="logout" type="button" aria-label="Sair da conta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Sair</button></div>
      <div class="year" id="yearNav">
        <button id="yprev" aria-label="Ano anterior">‹</button>
        <span id="ylabel"></span>
        <button id="ynext" aria-label="Próximo ano">›</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Meses"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="loading">Carregando seus lançamentos…</div></main>
<section class="wrap" id="authView" hidden></section>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script>
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SHORT=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CATS=['Alimentação','Lazer','Saúde','Casa','Transporte','Compras','Presentes','Educação','Viagem','Outros'];
const SECS=[
  {key:'income',  title:'Ganhos',         hint:'Salários, vales e rendas extras',        kind:'income', add:'Adicionar ganho'},
  {key:'essential',title:'Contas fixas',    hint:'Essenciais: moradia, contas da casa, seguros', kind:'bill', add:'Adicionar conta'},
  {key:'variable',title:'Gastos variáveis', hint:'Não essenciais: cartão, lazer, assinaturas',   kind:'bill', add:'Adicionar gasto'},
  {key:'extras',  title:'Gastos extras',    hint:'O que saiu do planejado neste mês',      kind:'extra', add:'Adicionar gasto extra'},
];
const TEMPLATE={
  income:['Salário líquido (Pessoa 1)','Vale-alimentação (Pessoa 1)','Vale-refeição (Pessoa 1)','Salário líquido (Pessoa 2)','Vale-alimentação (Pessoa 2)','Vale-refeição (Pessoa 2)','Renda extra (freelance, bicos)','Comissões e bônus','Aluguel recebido, aulas'],
  essential:['Moradia (aluguel/financiamento)','Condomínio','Mercado','Água','Luz','Gás','IPTU','Plano de saúde','Seguro de vida','Investimentos (obrigatório!)'],
  variable:['Cartão de crédito','Combustível','Farmácia','Pets','Imprevistos','Transporte (ônibus/Uber)','Manutenção do carro','Internet','Streaming (Netflix, Prime, Disney+)','Lazer (cinema, restaurantes)'],
};
/* Dólar com ponto nos milhares e vírgula nos centavos: $1.000,00 */
const dec=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl={format:v=>(v<0?'-':'')+'$'+dec.format(Math.abs(v))};
const pct=v=>(isFinite(v)?Math.round(v*100):0)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const mid=(y,m)=>`${y}-${String(m+1).padStart(2,'0')}`;
/* Aceita 1.000,50 · 1000,50 · 1.000 (mil) · 12.5 (doze e meio) */
function parseMoney(s){s=String(s).replace(/[US$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:0}
const sum=a=>(a||[]).reduce((t,r)=>t+(+r.value||0),0);

const now=new Date();
const S={year:now.getFullYear(),view:now.getMonth(),months:{},dirty:{},saving:{},again:{},timers:{},db:null,store:'loading',ready:false,confirm:false,pendingRender:false};
try{const v=JSON.parse(localStorage.getItem('bolso-view')||'null');if(v&&v.year)Object.assign(S,{year:v.year,view:v.view})}catch{}
const $main=document.getElementById('main');

function totals(m){
  if(!m)return null;
  const income=sum(m.income),essential=sum(m.essential),variable=sum(m.variable),extras=sum(m.extras);
  const bills=[...(m.essential||[]),...(m.variable||[])];
  const paid=bills.filter(r=>r.paid).reduce((t,r)=>t+(+r.value||0),0);
  const expenses=essential+variable+extras;
  return {income,essential,variable,extras,expenses,balance:income-expenses,paid,pending:essential+variable-paid,
    reserve:essential*6,rate:income?(income-expenses)/income:0,paidShare:(essential+variable)?paid/(essential+variable):0};
}
function normalize(m){for(const k of ['income','essential','variable','extras'])if(!Array.isArray(m[k]))m[k]=[];if(typeof m.notes!=='string')m.notes='';return m}
function prevExisting(y,m){for(let i=1;i<=24;i++){const d=new Date(y,m-i,1);const id=mid(d.getFullYear(),d.getMonth());if(S.months[id])return{id,y:d.getFullYear(),m:d.getMonth()}}return null}

async function initStore(){

      if(ev==='SIGNED_OUT'){if($auth.hidden)showAuth('login');return}
      if((ev==='INITIAL_SESSION'||ev==='SIGNED_IN')&&session){if(S.user?.id!==session.user.id)startSession(session.user);return}

async function startSession(user){
  S.user=user;S.months={};S.ready=false;S.dirty={};
  $auth.hidden=true;$main.hidden=false;showChrome(true);
  document.getElementById('whoEmail').textContent=user.email||'';
  setStatus('loading','Carregando…');render();
  const {data,error}=await sb.from('months').select('id,data');
  if(error){setStatus('error','Erro ao ler o banco');$main.innerHTML=`<div class="banner">Não consegui ler seus dados: ${esc(error.message)}. Confira se o script SQL foi executado no Supabase.</div>`;return}
  for(const r of data)S.months[r.id]=normalize(r.data||{});
  S.ready=true;setStatus('saved');render();
  if(S.channel)sb.removeChannel(S.channel);
  S.channel=sb.channel('months-'+user.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'months',filter:'user_id=eq.'+user.id},p=>{
      const id=p.new?.id||p.old?.id;if(!id||S.dirty[id]||S.saving[id])return;
      if(p.eventType==='DELETE')delete S.months[id];else S.months[id]=normalize(structuredClone(p.new.data||{}));
      requestRender();
    }).subscribe();
}

const EYE={

const AUTH_ERR={'Invalid login credentials':'E-mail ou senha incorretos.','Email not confirmed':'Confirme seu e-mail pelo link que enviamos antes de entrar.','User already registered':'Este e-mail já tem conta. Use "Entrar".'};
function showAuth(mode,msg){
  if(S.channel){sb.removeChannel(S.channel);S.channel=null}
  S.user=null;S.months={};S.ready=false;
  $main.hidden=true;showChrome(false);setStatus('loading','Desconectado');$auth.hidden=false;
  const T={login:['Entrar','Acesse seu controle financeiro.','Entrar'],signup:['Criar conta','Use seu e-mail e escolha uma senha com pelo menos 6 caracteres.','Criar conta'],
    forgot:['Esqueci a senha','Enviamos um link para você criar uma senha nova.','Enviar link'],reset:['Nova senha','Escolha sua nova senha.','Salvar senha']}[mode];
  $auth.innerHTML=`<form class="auth" novalidate><h1>${T[0]}</h1><p>${T[1]}</p>
    ${mode!=='reset'?'<label for="email">E-mail</label><input id="email" type="email" autocomplete="email" inputmode="email" required>':''}
    ${mode!=='forgot'?`<label for="pass">${mode==='reset'?'Nova senha':'Senha'}</label><div class="pw"><input id="pass" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" minlength="6" required><button type="button" class="eye" aria-label="Mostrar senha" aria-pressed="false">${EYE.open}</button></div>`:''}
    <button class="btn primary" type="submit">${T[2]}</button>
    <div class="msg" ${msg?'':'hidden'}>${esc(msg||'')}</div>
    ${mode==='login'?'<button type="button" class="switch" data-mode="signup">Ainda não tenho conta</button><button type="button" class="switch" data-mode="forgot">Esqueci a senha</button>'
      :mode!=='reset'?'<button type="button" class="switch" data-mode="login">Voltar para entrar</button>':''}
  </form>`;
  $auth.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>showAuth(b.dataset.mode));
  const eye=$auth.querySelector('.eye');
  if(eye)eye.onclick=()=>{const pass=$auth.querySelector('#pass'),show=pass.type==='password';
    pass.type=show?'text':'password';eye.innerHTML=show?EYE.closed:EYE.open;
    eye.setAttribute('aria-label',show?'Esconder senha':'Mostrar senha');eye.setAttribute('aria-pressed',show);pass.focus()};
  $auth.querySelector('form').onsubmit=async e=>{
    e.preventDefault();
    const btn=e.target.querySelector('[type=submit]'),box=e.target.querySelector('.msg');
    const email=$auth.querySelector('#email')?.value.trim(),password=$auth.querySelector('#pass')?.value;
    const fail=m=>{box.hidden=false;box.className='msg err';box.textContent=AUTH_ERR[m]||m;btn.disabled=false};
    if(mode!=='reset'&&!email)return fail('Digite seu e-mail.');
    if(mode!=='forgot'&&(!password||password.length<6))return fail('A senha precisa ter pelo menos 6 caracteres.');
    btn.disabled=true;
    const back=location.origin+location.pathname;
    try{
      if(mode==='login'){const r=await sb.auth.signInWithPassword({email,password});if(r.error)return fail(r.error.message)}
      else if(mode==='signup'){const r=await sb.auth.signUp({email,password,options:{emailRedirectTo:back}});if(r.error)return fail(r.error.message);
        if(!r.data.session)showAuth('login',`Conta criada. Abra o link que enviamos para ${email} e depois entre aqui.`)}
      else if(mode==='forgot'){const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:back});if(r.error)return fail(r.error.message);
        showAuth('login','Se o e-mail estiver cadastrado, o link para criar uma senha nova chega em instantes.')}
      else{const r=await sb.auth.updateUser({password});if(r.error)return fail(r.error.message);toast('Senha alterada.');startSession(r.data.user)}
    }catch(err){fail('Sem conexão. Confira a internet e tente de novo.')}
  };
  $auth.querySelector('input')?.focus();
}
/* Sair: salva o que estiver pendente (no máximo 4 s) e encerra a sessão mesmo sem internet */
document.getElementById('logout').onclick=async e=>{
  const b=e.currentTarget;b.disabled=true;
  try{await Promise.race([saveNow(),new Promise(r=>setTimeout(r,4000))])}catch{}
  try{const {error}=await sb.auth.signOut();if(error)await sb.auth.signOut({scope:'local'})}catch{try{await sb.auth.signOut({scope:'local'})}catch{}}
  b.disabled=false;showAuth('login','Você saiu da sua conta.');
};
function touch(id){
  const m=S.months[id];if(m)m.updatedAt=new Date().toISOString();
  S.dirty[id]=true;setStatus('saving');
  clearTimeout(S.timers[id]);S.timers[id]=setTimeout(()=>flush(id),600);
}
async function flush(id){
  if(!S.user)return;
  if(S.saving[id]){S.again[id]=true;return}
  S.saving[id]=true;S.dirty[id]=false;
  try{
    const m=S.months[id];
    const {error}=m?await sb.from('months').upsert({user_id:S.user.id,id,data:m,updated_at:new Date().toISOString()})
      :await sb.from('months').delete().eq('id',id);
    if(error)throw error;
    if(!Object.values(S.dirty).some(Boolean))setStatus('saved');
  }catch(e){
    S.dirty[id]=true;setStatus('error','Erro ao salvar, tentando de novo…');
    clearTimeout(S.timers[id]);S.timers[id]=setTimeout(()=>flush(id),3000);
  }finally{S.saving[id]=false;if(S.again[id]){S.again[id]=false;flush(id)}}
}

  </div>
  <div class="card"><div class="lbl" style="display:flex;gap:16px;flex-wrap:wrap"><span>Ganhos × despesas por mês</span><span><i class="dot" style="background:var(--gold)"></i>Ganhos</span><span><i class="dot" style="background:var(--c-ess)"></i>Despesas</span></div><div class="chart">${svg}</div></div>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th>Ganhos</th><th>Contas fixas</th><th>Variáveis</th><th>Extras</th><th>Despesas</th><th>Saldo</th></tr></thead><tbody>${tr}</tbody>
  <tfoot><tr><td>Total ${S.year}</td><td>${brl.format(Y.income)}</td><td>${brl.format(Y.essential)}</td><td>${brl.format(Y.variable)}</td><td>${brl.format(Y.extras)}</td><td>${brl.format(Y.expenses)}</td><td class="${Y.balance>=0?'pos':'neg'}">${brl.format(Y.balance)}</td></tr></tfoot></table></div>`;
}
/* ---------- Salvar e exportar ---------- */
const ICON={
  save:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 2h8l3 3v9H2V2z"/><path d="M5 2v4h5V2M5 14V9h6v5"/></svg>',
  file:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8m-3-3l3 3 3-3M3 13h10"/></svg>'};
const exportBtns=()=>`<button class="btn" data-act="pdf">${ICON.file}PDF</button><button class="btn" data-act="xlsx">${ICON.file}Excel</button>`;
const money=v=>brl.format(v).replace(/ /g,' ');
const LIBS={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',autotable:'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'};
const libs={};
function loadLib(k){return libs[k]||(libs[k]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[k];s.onload=res;s.onerror=()=>{libs[k]=null;rej(new Error('Não consegui carregar o gerador de arquivo. Verifique a internet.'))};document.head.appendChild(s)}))}
let toastTimer;
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
const MIME={pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
async function saveFile(filename,data){
  const blob=new Blob([data],{type:MIME[filename.split('.').pop()]||'application/octet-stream'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Baixando '+filename);
}
async function saveNow(){
  document.activeElement?.blur?.();
  const ids=Object.keys(S.dirty).filter(k=>S.dirty[k]);
  for(const id of ids){clearTimeout(S.timers[id]);await flush(id)}
  while(Object.values(S.saving).some(Boolean))await new Promise(r=>setTimeout(r,100));
  return !Object.values(S.dirty).some(Boolean);
}
/* Linhas de cada seção no formato [descrição, detalhe, situação, valor] */
function secRows(sec,m){
  return m[sec.key].map(r=>sec.kind==='income'?[r.desc||'—','','',+r.value||0]
    :sec.kind==='bill'?[r.desc||'—',r.due?'Dia '+r.due:'',r.paid?'Pago':'Pendente',+r.value||0]
    :[r.desc||'—',r.date?r.date.split('-').reverse().join('/'):'',r.cat||'',+r.value||0]);
}
const secHead=sec=>sec.kind==='income'?['Descrição','','','Valor']:sec.kind==='bill'?['Descrição','Vencimento','Situação','Valor']:['Descrição','Data','Categoria','Valor'];
function summaryRows(t){return [['Ganhos',t.income],['Contas fixas',t.essential],['Gastos variáveis',t.variable],['Gastos extras',t.extras],['Despesas totais',t.expenses],['Saldo do mês',t.balance],['Já pago',t.paid],['Falta pagar',t.pending],['Reserva de emergência ideal',t.reserve]]}

function monthSheet(m,name){
  const X=window.XLSX,t=totals(m),aoa=[[`BOLSO · ${name}`],[],['RESUMO']];
  for(const [k,v] of summaryRows(t))aoa.push([k,'','',v]);
  for(const sec of SECS){aoa.push([],[sec.title.toUpperCase()],secHead(sec),...secRows(sec,m),['Total '+sec.title.toLowerCase(),'','',t[sec.key]])}
  if(m.notes)aoa.push([],['ANOTAÇÕES'],[m.notes]);
  const ws=X.utils.aoa_to_sheet(aoa);fmtMoney(ws);ws['!cols']=[{wch:40},{wch:14},{wch:16},{wch:18}];return ws;
}
function fmtMoney(ws){for(const ref in ws){if(ref[0]==='!')continue;const c=ws[ref];if(c.t==='n')c.z='"$"#,##0.00;-"$"#,##0.00'}}
async function exportXlsx(){
  await loadLib('xlsx');const X=window.XLSX,wb=X.utils.book_new();
  if(S.view==='ano'){
    const aoa=[[`BOLSO · Resumo ${S.year}`],[],['Mês','Ganhos','Contas fixas','Variáveis','Extras','Despesas','Saldo']],tot=[0,0,0,0,0,0];
    for(let i=0;i<12;i++){const t=totals(S.months[mid(S.year,i)]);if(!t){aoa.push([MONTHS[i],'Sem lançamentos']);continue}
      const v=[t.income,t.essential,t.variable,t.extras,t.expenses,t.balance];v.forEach((x,j)=>tot[j]+=x);aoa.push([MONTHS[i],...v])}
    aoa.push(['Total '+S.year,...tot]);
    const ws=X.utils.aoa_to_sheet(aoa);fmtMoney(ws);ws['!cols']=[{wch:16},...Array(6).fill({wch:16})];X.utils.book_append_sheet(wb,ws,'Resumo '+S.year);
    for(let i=0;i<12;i++){const m=S.months[mid(S.year,i)];if(m)X.utils.book_append_sheet(wb,monthSheet(m,`${MONTHS[i]} ${S.year}`),SHORT[i])}
    return saveFile(`Bolso-${S.year}.xlsx`,X.write(wb,{bookType:'xlsx',type:'array'}));
  }
  const id=mid(S.year,S.view),name=`${MONTHS[S.view]} ${S.year}`;
  X.utils.book_append_sheet(wb,monthSheet(S.months[id],name),MONTHS[S.view]);
  return saveFile(`Bolso-${id}-${MONTHS[S.view]}.xlsx`,X.write(wb,{bookType:'xlsx',type:'array'}));
}
async function exportPdf(){
  await loadLib('jspdf');await loadLib('autotable');
  const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),M={left:40,right:40};
  const ink=[21,23,28],gold=[242,194,0],soft=[251,241,196];
  const title=S.view==='ano'?`Resumo ${S.year}`:`${MONTHS[S.view]} ${S.year}`;
  doc.setFillColor(...gold);doc.rect(40,34,26,26,'F');doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(...ink);doc.text('B',48,53);
  doc.setFontSize(20);doc.text('BOLSO',74,54);doc.setFontSize(14);doc.text(title,40,84);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(110);doc.text('Gerado em '+new Date().toLocaleDateString('pt-BR'),40,100);
  const base={theme:'grid',margin:M,styles:{fontSize:9.5,cellPadding:5,textColor:ink},headStyles:{fillColor:ink,textColor:255},footStyles:{fillColor:soft,textColor:ink,fontStyle:'bold'}};
  if(S.view==='ano'){
    const body=[],tot=[0,0,0,0,0,0];
    for(let i=0;i<12;i++){const t=totals(S.months[mid(S.year,i)]);if(!t){body.push([MONTHS[i],{content:'Sem lançamentos',colSpan:6,styles:{textColor:150}}]);continue}
      const v=[t.income,t.essential,t.variable,t.extras,t.expenses,t.balance];v.forEach((x,j)=>tot[j]+=x);body.push([MONTHS[i],...v.map(money)])}
    doc.autoTable({...base,startY:116,head:[['Mês','Ganhos','Contas fixas','Variáveis','Extras','Despesas','Saldo']],body,foot:[['Total',...tot.map(money)]],columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}}});
    return saveFile(`Bolso-${S.year}.pdf`,doc.output('arraybuffer'));
  }
  const id=mid(S.year,S.view),m=S.months[id],t=totals(m),right={3:{halign:'right'}};
  doc.autoTable({...base,startY:116,head:[['Resumo do mês','']],body:summaryRows(t).map(([k,v])=>[k,money(v)]),columnStyles:{1:{halign:'right',fontStyle:'bold'}},tableWidth:300});
  for(const sec of SECS){
    const rows=secRows(sec,m).map(r=>[r[0],r[1],r[2],money(r[3])]);
    doc.autoTable({...base,startY:doc.lastAutoTable.finalY+18,head:[[{content:sec.title.toUpperCase(),colSpan:4}],secHead(sec)],
      body:rows.length?rows:[[{content:'Nenhum lançamento',colSpan:4,styles:{textColor:150}}]],foot:[['Total','','',money(t[sec.key])]],
      headStyles:sec.key==='extras'?{fillColor:gold,textColor:ink}:base.headStyles,columnStyles:{0:{cellWidth:'auto'},1:{cellWidth:80},2:{cellWidth:80},3:{halign:'right',cellWidth:95}}});
  }
  if(m.notes){doc.autoTable({...base,startY:doc.lastAutoTable.finalY+18,head:[['Anotações']],body:[[m.notes]]})}
  return saveFile(`Bolso-${id}-${MONTHS[S.view]}.pdf`,doc.output('arraybuffer'));
}
async function busy(btn,label,fn){const old=btn.innerHTML;btn.disabled=true;btn.textContent=label;
  try{await fn()}catch(e){toast(e.message||'Algo deu errado. Tente de novo.')}finally{if(btn.isConnected){btn.disabled=false;btn.innerHTML=old}}}

function niceStep(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function short(v){return v>=1000?'$'+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':'$'+v}

/* ---------- Ações ---------- */
function setView(v){S.view=v;S.confirm=false;try{localStorage.setItem('bolso-view',JSON.stringify({year:S.year,view:v}))}catch{}render();window.scrollTo({top:0})}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setView(b.dataset.tab==='ano'?'ano':+b.dataset.tab)});
document.getElementById('yprev').onclick=()=>{S.year--;setView(S.view)};
document.getElementById('ynext').onclick=()=>{S.year++;setView(S.view)};

function findRow(el){const row=el.closest('[data-row]');if(!row)return{};const id=mid(S.year,S.view),m=S.months[id];const arr=m?.[row.dataset.sec];return{id,m,arr,r:arr?.find(x=>x.id===row.dataset.row),row}}
$main.addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-tab]');if(tr)return setView(+tr.dataset.tab);
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=mid(S.year,S.view),act=b.dataset.act;
  if(act==='create'){
    const f=b.dataset.from,m={label:`${MONTHS[S.view]} ${S.year}`,income:[],essential:[],variable:[],extras:[],notes:''};
    if(f==='template')for(const k in TEMPLATE)m[k]=TEMPLATE[k].map(desc=>({id:rid(),desc,value:0,...(k!=='income'?{paid:false,due:''}:{})}));
    else if(S.months[f]){const src=S.months[f];for(const k of ['income','essential','variable'])m[k]=src[k].map(r=>({...r,id:rid(),...(k!=='income'?{paid:false}:{})}))}
    S.months[id]=m;touch(id);flush(id);render();return;
  }
  if(act==='add'){
    const sec=SECS.find(s=>s.key===b.dataset.sec),r={id:rid(),desc:'',value:0};
    if(sec.kind==='bill')Object.assign(r,{paid:false,due:''});
    if(sec.kind==='extra'){const d=new Date();Object.assign(r,{cat:'Outros',date:(d.getFullYear()===S.year&&d.getMonth()===S.view)?d.toISOString().slice(0,10):mid(S.year,S.view)+'-01'})}
    S.months[id][sec.key].push(r);touch(id);render();
    document.getElementById(`${sec.key}-${r.id}-desc`)?.focus();return;
  }
  if(act==='del'){const {arr,r}=findRow(b);if(r){arr.splice(arr.indexOf(r),1);touch(id);render()}return}
  if(act==='save'){busy(b,'Salvando…',async()=>{const ok=await saveNow();
      if(ok){toast(`${MONTHS[S.view]} salvo ${S.store==='db'?'no banco':'neste navegador'}.`);b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),1500)}
      else toast('Não consegui salvar. Confira a conexão e tente de novo.')});return}
  if(act==='pdf'){busy(b,'Gerando PDF…',async()=>{await saveNow();await exportPdf()});return}
  if(act==='xlsx'){busy(b,'Gerando Excel…',async()=>{await saveNow();await exportXlsx()});return}
  if(act==='clear-ask'){S.confirm=true;render();return}
  if(act==='clear-no'){S.confirm=false;render();return}
  if(act==='clear-yes'){S.confirm=false;delete S.months[id];S.dirty[id]=true;clearTimeout(S.timers[id]);flush(id);render();return}
});
$main.addEventListener('input',e=>{
  const el=e.target,f=el.dataset.f;if(!f)return;
  const id=mid(S.year,S.view),m=S.months[id];if(!m)return;
  if(f==='notes'){m.notes=el.value;touch(id);return}
  const {r,row}=findRow(el);if(!r)return;
  if(f==='value')r.value=parseMoney(el.value);
  else if(f==='paid'){r.paid=el.checked;row.classList.toggle('paid',el.checked)}
  else if(f==='due'){el.value=el.value.replace(/\D/g,'');r.due=el.value}
  else r[f]=el.value;
  touch(id);updateTotals();
});
$main.addEventListener('change',e=>{if(e.target.dataset.f==='cat'){const {r}=findRow(e.target);if(r){r.cat=e.target.value;touch(mid(S.year,S.view))}}});
$main.addEventListener('focusin',e=>{const el=e.target;if(el.dataset.f==='value'){const {r}=findRow(el);el.value=r&&r.value?String(r.value).replace('.',','):'';el.select()}});
$main.addEventListener('focusout',e=>{const el=e.target;
  if(el.dataset.f==='value'){const {r}=findRow(el);if(r)el.value=r.value?dec.format(r.value):''}
  setTimeout(()=>{if(S.pendingRender&&!($main.contains(document.activeElement)&&document.activeElement.matches('input,select,textarea'))){S.pendingRender=false;render()}},0)});
$main.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.row input')){e.preventDefault();e.target.blur()}});

renderHeader();
initStore().then(()=>{if(S.view!=='ano')updateTotals()});
const _render=render;render=function(){_render();if(S.view!=='ano')updateTotals()};
</script>
</body>
