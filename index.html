<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bolso</title>
<meta name="description" content="Controle financeiro mensal: ganhos, contas, gastos e visão do ano.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17191E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bolso">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- Ícone da tela de início: quadrado e sem transparência, fundo escuro e B amarelo, para o iOS manter a cor no modo escuro -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header (marca + ano + abas dos meses) · mês em 2 colunas: lançamentos à esquerda, resumo fixo à direita */
:root{
  --paper:#F6F5EF; --surface:#FFFFFF; --ink:#15171C; --muted:#686A72; --line:#E3E1D8;
  --gold:#F2C200; --gold-soft:#FBF1C4; --on-gold:#15171C;
  --band:#15171C; --on-band:#FFFFFF;
  --pos:#1D7F47; --neg:#C2362C; --c-ess:#15171C; --c-var:#8C8E96; --c-ext:#E08A1E;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1013; --surface:#17191E; --ink:#ECEBE5; --muted:#9B9DA4; --line:#2A2C33;
  --gold:#F5C518; --gold-soft:#3A3213; --on-gold:#15171C; --band:#24262D; --on-band:#FFFFFF;
  --pos:#4CC27E; --neg:#F0675B; --c-ess:#ECEBE5; --c-var:#6E7079; --c-ext:#F0A040; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1013; --surface:#17191E; --ink:#ECEBE5; --muted:#9B9DA4; --line:#2A2C33;
  --gold:#F5C518; --gold-soft:#3A3213; --on-gold:#15171C; --band:#24262D; --on-band:#FFFFFF;
  --pos:#4CC27E; --neg:#F0675B; --c-ess:#ECEBE5; --c-var:#6E7079; --c-ext:#F0A040; color-scheme:dark }

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.brand .mark{width:34px;height:34px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;border-radius:6px;font-size:22px}
.brand b{color:var(--gold)}
.year{display:flex;align-items:center;gap:4px;margin-left:auto}
.year button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.year button:hover{border-color:var(--ink)}
.year span{font-family:var(--display);font-weight:800;font-size:20px;min-width:64px;text-align:center}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status[data-s="saved"] i{background:var(--pos)} .status[data-s="saving"] i{background:var(--gold)} .status[data-s="error"] i{background:var(--neg)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 12px;text-align:left;min-width:74px}
.tab:hover{background:var(--paper)}
.tab .n{display:block;font-weight:600;font-size:14px}
.tab .v{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tab .v.pos{color:var(--pos)} .tab .v.neg{color:var(--neg)}
.tab[aria-current="true"]{background:var(--gold);color:var(--on-gold)}
.tab[aria-current="true"] .v{color:var(--on-gold);opacity:.75}
.tab.overview{border-color:var(--line);margin-right:6px}
.tab.now .n::after{content:"•";margin-left:4px;color:var(--gold)}
.tab[aria-current="true"].now .n::after{color:var(--on-gold)}

main{padding-block:24px 64px}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:14px}

/* Month layout */
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.mhead h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;margin:0;line-height:1;text-wrap:balance}
.mhead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)} aside{order:-1}}
.col{display:grid;gap:22px;min-width:0}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--band);color:var(--on-band)}
.sec-h h2{margin:0;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.01em;text-transform:uppercase}
.sec-h small{display:block;font-size:12px;opacity:.7;font-weight:400;text-transform:none;letter-spacing:0;font-family:var(--body)}
.sec-h .tot{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:17px;white-space:nowrap}
.sec.extras .sec-h{background:var(--gold);color:var(--on-gold)}
.cols{display:grid;gap:8px;padding:8px 16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
.row{display:grid;gap:8px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.g-income{grid-template-columns:minmax(0,1fr) 150px 32px}
.g-bill{grid-template-columns:28px minmax(0,1fr) 62px 150px 32px}
.g-extra{grid-template-columns:118px minmax(0,1fr) 128px 150px 32px}
.row input,.row select{width:100%;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:7px 8px}
.row input:hover,.row select:hover{border-color:var(--line)}
.row input:focus,.row select:focus{border-color:var(--gold);background:var(--paper);outline:none}
.money{position:relative}
.money::before{content:"$";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.money input{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-left:22px}
.row input.due{text-align:center;font-family:var(--mono)}
.duebox{display:flex;align-items:center;gap:6px;min-width:0}
/* Conta não paga que vence em até 3 dias: fundo vermelho a 50% */
.row.soon{background:rgba(194,54,44,.5);background:color-mix(in srgb,var(--neg) 50%,transparent)}
.row.soon .duelbl,.row.soon input{color:var(--ink)}
.duelbl{display:none}
.chk{appearance:none;width:22px!important;height:22px;border:2px solid var(--line)!important;border-radius:6px!important;padding:0!important;display:grid;place-items:center;cursor:pointer;background:var(--surface)!important}
.chk:checked{background:var(--pos)!important;border-color:var(--pos)!important}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row.paid input.desc{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.del{width:30px;height:30px;border:0;background:transparent;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.del:hover{background:var(--paper);color:var(--neg)}
.add{display:flex;align-items:center;gap:6px;width:100%;border:0;border-top:1px dashed var(--line);background:transparent;padding:11px 16px;color:var(--muted);font-weight:600;font-size:14px;text-align:left}
.add:hover{color:var(--ink);background:var(--paper)}
.empty-row{padding:16px;color:var(--muted);font-size:14px}
@media (max-width:600px){
  .cols{display:none}
  .g-income{grid-template-columns:minmax(0,1fr) 120px 30px}
  /* Conta no celular em 2 linhas: [✓ descrição ×] e [Vence dia __ · valor] */
  .row.g-bill{grid-template-columns:26px minmax(0,1fr) 130px 30px;grid-template-areas:"chk desc desc del" ". due val .";row-gap:4px;padding-block:8px}
  .g-bill .chk{grid-area:chk} .g-bill .desc{grid-area:desc} .g-bill .duebox{grid-area:due} .g-bill .money{grid-area:val} .g-bill .del{grid-area:del}
  .duelbl{display:inline;font-size:13px;color:var(--muted);white-space:nowrap}
  .duebox input.due{width:52px;flex:none;border-color:var(--line);font-size:15px}
  .g-extra{grid-template-columns:minmax(0,1fr) 120px 30px;row-gap:2px}
  .g-extra .xdate{grid-column:1;grid-row:2} .g-extra .xcat{grid-column:2/4;grid-row:2}
  .row{padding:6px 10px}
}

/* Aside */
aside{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px);min-width:0}
@media (max-width:900px){aside{position:static}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--mono);font-weight:600;font-size:32px;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.balance{background:var(--band);color:var(--on-band);border:0}
.balance .lbl{color:var(--on-band);opacity:.65}
.balance .pos{color:#6BE09A} .balance .neg{color:#FF8A7F}
.kv{display:grid;gap:8px;margin-top:12px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:10px}
.kv span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:12px}
.stack span{height:100%;transition:width .3s}
.legend{display:grid;gap:6px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:var(--mono);font-weight:500}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.meter span{display:block;height:100%;background:var(--pos);transition:width .3s}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px;resize:vertical;margin-top:8px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--neg)}
.btn.danger.solid{background:var(--neg);border-color:var(--neg);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.startbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,40px);max-width:640px}
.startbox h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 8px;letter-spacing:-.02em}
.startbox p{color:var(--muted);margin:0 0 20px}
.choices{display:grid;gap:10px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:14px 16px}
.choice:hover{border-color:var(--ink)}
.choice strong{font-size:15px} .choice span{font-size:13px;color:var(--muted)}
.choice.rec{border-color:var(--gold);background:var(--gold-soft)}

/* Year */
.ycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart .gl{stroke:var(--line)} .chart .tx{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .bi{fill:var(--gold)} .chart .be{fill:var(--c-ess)}
.chart .mx{fill:var(--ink);font-family:var(--body);font-size:12px;font-weight:600}
.tablewrap{overflow-x:auto;margin-top:22px}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--paper)}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
td:first-child{font-family:var(--body);font-weight:600}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--paper)}
tr.nodata td{color:var(--muted);font-weight:400}
tfoot td{font-weight:600;background:var(--gold-soft);border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.loading{color:var(--muted);padding:40px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn svg{vertical-align:-2px;margin-right:4px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ok{background:var(--pos);border-color:var(--pos);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--band);color:var(--on-band);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tools{order:5;display:flex;align-items:center;gap:10px;min-width:0}
.year[hidden]+.tools{margin-left:auto}
.lang{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-size:15px;font-weight:600;white-space:nowrap}
.lang:hover{border-color:var(--ink)}
.lang:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.lang .lang-code{display:none}
/* A lista nativa fica invisível sobre o botão; 16px evita o zoom automático do iOS ao tocar */
.lang select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);min-width:0}
.who span{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--neg);background:var(--surface);color:var(--neg);border-radius:10px;font-size:15px;font-weight:600;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.logout:hover,.logout:active{background:var(--neg);color:#fff}
.logout:disabled{opacity:.6;cursor:wait}
.auth{max-width:420px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.auth h1{font-family:var(--display);font-weight:800;font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.auth p{color:var(--muted);margin:0 0 20px;font-size:14px}
.auth label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.auth input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:11px 12px;font-size:16px}
.auth input:focus{outline:none;border-color:var(--gold)}
.pw{position:relative}
.pw input{padding-right:48px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.eye:hover{color:var(--ink);background:var(--line)}
.auth .btn{width:100%;margin-top:18px;padding:12px}
.auth .switch{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline}
.auth .msg{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--gold-soft)}
.auth .msg.err{background:transparent;border:1px solid var(--neg);color:var(--neg)}
.auth code{font-family:var(--mono);font-size:13px;background:var(--paper);padding:2px 5px;border-radius:4px}
@media (max-width:600px){
  .brand{font-size:22px}
  /* Celular: marca + Sair na 1ª linha, ano + status na 2ª */
  .top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand tools" "year status";gap:10px 12px}
  .brand{grid-area:brand}
  .tools{grid-area:tools;justify-self:end}
  .lang{padding:0 12px}
  .lang .lang-name{display:none}
  .lang .lang-code{display:inline}
  .who span{display:none}
  .year{grid-area:year;margin-left:0;justify-self:start}
  .year button{width:44px;height:44px}
  .status{grid-area:status;justify-self:end;text-align:right}
  .mhead{align-items:stretch}
  .actions{width:100%}
  .actions .btn{flex:1 1 auto;text-align:center}
}
/* Instalar na tela de início */
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body.has-ibar{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.ibar{position:fixed;z-index:15;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.ibar img{width:44px;height:44px;border-radius:10px;flex:none}
.ibar-t{flex:1;min-width:0;font-size:13px;line-height:1.3;color:var(--muted)}
.ibar-t strong{display:block;font-size:15px;color:var(--ink)}
.ibar .btn{min-height:44px;flex:none}
.ibar-x{flex:none;width:44px;height:44px;margin-left:-6px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;border-radius:10px}
.appfoot{padding-block:0 28px;text-align:center}
.appfoot button{min-height:44px;padding:0 12px;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline}
.sheet{width:min(460px,calc(100vw - 24px));margin:auto auto calc(12px + env(safe-area-inset-bottom,0px));padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink)}
@media (min-width:601px){.sheet{margin:auto}}
.sheet::backdrop{background:rgba(0,0,0,.45)}
.sheet h2{margin:0 0 4px;font-family:var(--display);font-size:22px}
.sheet>p{margin:0 0 14px;font-size:14px;color:var(--muted)}
.sheet ol{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:12px}
.sheet li{display:flex;align-items:center;gap:12px;font-size:15px;line-height:1.35}
.sheet .step{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:14px}
.sheet li svg{vertical-align:-4px;margin-inline:2px}
.sheet .note{margin:0 0 16px;padding:10px 12px;border-radius:10px;background:var(--gold-soft);font-size:13px;line-height:1.4}
.sheet .btn{width:100%;min-height:48px;font-size:16px}
/* Em telas de toque, 16px evita o zoom automático do iOS ao focar um campo */
@media (hover:none) and (pointer:coarse){input,select,textarea{font-size:16px!important}}
@media (display-mode:standalone){html,body{overscroll-behavior-y:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><span class="mark">B</span><span>BOL<b>SO</b></span></div>
      <div class="status" id="status" data-s="loading"><i></i><span>Conectando ao banco…</span></div>
      <div class="year" id="yearNav">
        <button id="yprev" aria-label="Ano anterior">‹</button>
        <span id="ylabel"></span>
        <button id="ynext" aria-label="Próximo ano">›</button>
      </div>
      <div class="tools">
        <label class="lang"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.500-3.800 9c-2.500-2.500-3.800-5.500-3.800-9s1.300-6.500 3.800-9z"/></svg><span class="lang-name" id="langName"></span><span class="lang-code" id="langCode"></span>
          <select id="lang"><option value="en">English</option><option value="pt">Português</option><option value="es">Español</option></select></label>
        <div class="who" id="who" hidden><span id="whoEmail"></span><button id="logout" class="logout" type="button" aria-label="Sair da conta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Sair</button></div>

</header>
<main class="wrap" id="main"><div class="loading">Carregando seus lançamentos…</div></main>
<section class="wrap" id="authView" hidden></section>
<footer class="wrap appfoot" id="appfoot" hidden><button type="button" id="footInstall"></button></footer>
<div class="ibar" id="ibar" role="region" hidden><img src="apple-touch-icon.png?v=3" alt=""><div class="ibar-t"><strong id="ibarTitle"></strong><span id="ibarText"></span></div><button type="button" class="btn primary" id="ibarInstall"></button><button type="button" class="ibar-x" id="ibarClose">×</button></div>
<dialog class="sheet" id="isheet" aria-labelledby="isheetTitle"></dialog>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script>
/* Idioma: o texto em português é a chave de tradução. Categorias ficam salvas em português e só são traduzidas na tela. */
const I18N=window.BOLSO_I18N;
let LANG='pt',MONTHS,SHORT,SECS;
const tx=(key,...args)=>(I18N[LANG].strings[key]??key).replace(/\{(\d)\}/g,(_,i)=>args[i]);
const CATS=['Alimentação','Lazer','Saúde','Casa','Transporte','Compras','Presentes','Educação','Viagem','Outros'];
const SEC_BASE=[
  {key:'income',  title:'Ganhos',         hint:'Salários, vales e rendas extras',        kind:'income', add:'Adicionar ganho'},
  {key:'essential',title:'Contas fixas',    hint:'Essenciais: moradia, contas da casa, seguros', kind:'bill', add:'Adicionar conta'},
  {key:'variable',title:'Gastos variáveis', hint:'Não essenciais: cartão, lazer, assinaturas',   kind:'bill', add:'Adicionar gasto'},
  {key:'extras',  title:'Gastos extras',    hint:'O que saiu do planejado neste mês',      kind:'extra', add:'Adicionar gasto extra'},
];
function setLang(code){
  LANG=I18N[code]?code:'pt';MONTHS=I18N[LANG].months;SHORT=I18N[LANG].short;
  SECS=SEC_BASE.map(s=>({...s,title:tx(s.title),hint:tx(s.hint),add:tx(s.add)}));
}
{let saved=null;try{saved=localStorage.getItem('bolso-lang')}catch{}setLang(saved)}
const TEMPLATE={
  income:['Salário líquido (Pessoa 1)','Vale-alimentação (Pessoa 1)','Vale-refeição (Pessoa 1)','Salário líquido (Pessoa 2)','Vale-alimentação (Pessoa 2)','Vale-refeição (Pessoa 2)','Renda extra (freelance, bicos)','Comissões e bônus','Aluguel recebido, aulas'],
  essential:['Moradia (aluguel/financiamento)','Condomínio','Mercado','Água','Luz','Gás','IPTU','Plano de saúde','Seguro de vida','Investimentos (obrigatório!)'],
  variable:['Cartão de crédito','Combustível','Farmácia','Pets','Imprevistos','Transporte (ônibus/Uber)','Manutenção do carro','Internet','Streaming (Netflix, Prime, Disney+)','Lazer (cinema, restaurantes)'],
};
/* Dólar com ponto nos milhares e vírgula nos centavos: $1.000,00 */
const dec=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl={format:v=>(v<0?'-':'')+'$'+dec.format(Math.abs(v))};
const pct=v=>(isFinite(v)?Math.round(v*100):0)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const mid=(y,m)=>`${y}-${String(m+1).padStart(2,'0')}`;
/* Aceita 1.000,50 · 1000,50 · 1.000 (mil) · 12.5 (doze e meio) · 1,000.50 (formato inglês) */
function parseMoney(s){s=String(s).replace(/[US$\s]/g,'');if(!s)return 0;if(s.includes(',')&&s.lastIndexOf('.')>s.lastIndexOf(','))s=s.replace(/,/g,'');else if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:0}
const sum=a=>(a||[]).reduce((t,r)=>t+(+r.value||0),0);

const now=new Date();
const S={year:now.getFullYear(),view:now.getMonth(),months:{},dirty:{},saving:{},again:{},timers:{},db:null,store:'loading',ready:false,confirm:false,pendingRender:false};
try{const v=JSON.parse(localStorage.getItem('bolso-view')||'null');if(v&&v.year)Object.assign(S,{year:v.year,view:v.view})}catch{}
const $main=document.getElementById('main');

function totals(m){
  if(!m)return null;
  const income=sum(m.income),essential=sum(m.essential),variable=sum(m.variable),extras=sum(m.extras);
  const bills=[...(m.essential||[]),...(m.variable||[])];
  const paid=bills.filter(r=>r.paid).reduce((t,r)=>t+(+r.value||0),0);
  const expenses=essential+variable+extras;
  return {income,essential,variable,extras,expenses,balance:income-expenses,paid,pending:essential+variable-paid,
    reserve:essential*6,rate:income?(income-expenses)/income:0,paidShare:(essential+variable)?paid/(essential+variable):0};
}
function normalize(m){for(const k of ['income','essential','variable','extras'])if(!Array.isArray(m[k]))m[k]=[];if(typeof m.notes!=='string')m.notes='';return m}
function prevExisting(y,m){for(let i=1;i<=24;i++){const d=new Date(y,m-i,1);const id=mid(d.getFullYear(),d.getMonth());if(S.months[id])return{id,y:d.getFullYear(),m:d.getMonth()}}return null}

/* ---------- Banco de dados (Supabase) ---------- */
const CFG=window.BOLSO_CONFIG||{};
const configured=!!(CFG.supabaseUrl&&CFG.supabaseKey&&!CFG.supabaseUrl.includes('SEU-PROJETO'));
const sb=configured&&window.supabase?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey):null;
S.store='db';S.user=null;S.channel=null;
const $auth=document.getElementById('authView');
function setStatus(s,msg){const el=document.getElementById('status');el.dataset.s=s;
  S.status=[s,msg];el.querySelector('span').textContent=tx(msg||({saved:'Salvo no banco',saving:'Salvando…',error:'Erro ao salvar',loading:'Conectando…'})[s])}
function showChrome(on){for(const id of ['tabs','yearNav','who'])document.getElementById(id).hidden=!on}
async function initStore(){
  if(!sb)return showSetup();
  sb.auth.onAuthStateChange((ev,session)=>{
    setTimeout(()=>{
      if(ev==='PASSWORD_RECOVERY')return showAuth('reset');
      if(ev==='SIGNED_OUT'){if($auth.hidden)showAuth('login');return}
      if((ev==='INITIAL_SESSION'||ev==='SIGNED_IN')&&session){if(S.user?.id!==session.user.id)startSession(session.user);return}
      if(ev==='INITIAL_SESSION')showAuth('login');
    },0);
  });
}
async function startSession(user){
  S.user=user;S.months={};S.ready=false;S.dirty={};
  $auth.hidden=true;$main.hidden=false;showChrome(true);
  document.getElementById('whoEmail').textContent=user.email||'';
  setStatus('loading','Carregando…');render();
  const {data,error}=await sb.from('months').select('id,data');
  if(error&&(!navigator.onLine||/fetch|load failed|network/i.test(error.message))){
    setStatus('error','Sem internet');$main.innerHTML=`<div class="banner">${tx('Você está sem internet. Seus lançamentos aparecem assim que a conexão voltar.')}</div>`;return}
  if(error){setStatus('error','Erro ao ler o banco');$main.innerHTML=`<div class="banner">${tx('Não consegui ler seus dados: {0}. Confira se o script SQL foi executado no Supabase.',esc(error.message))}</div>`;return}
  for(const r of data)S.months[r.id]=normalize(r.data||{});
  S.ready=true;setStatus('saved');render();
  if(S.channel)sb.removeChannel(S.channel);
  S.channel=sb.channel('months-'+user.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'months',filter:'user_id=eq.'+user.id},p=>{
      const id=p.new?.id||p.old?.id;if(!id||S.dirty[id]||S.saving[id])return;
      if(p.eventType==='DELETE')delete S.months[id];else S.months[id]=normalize(structuredClone(p.new.data||{}));
      requestRender();
    }).subscribe();
}
function showSetup(){
  S.authMode='setup';$main.hidden=true;showChrome(false);setStatus('error','Banco não configurado');$auth.hidden=false;
  $auth.innerHTML=`<div class="auth"><h1>${tx('Falta conectar o banco')}</h1><p>${tx('Abra o arquivo {0} e coloque a URL e a chave pública (anon) do seu projeto Supabase.','<code>config.js</code>')}</p></div>`;
}
const EYE={
  open:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  closed:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'};
const AUTH_ERR={'Invalid login credentials':'E-mail ou senha incorretos.','Email not confirmed':'Confirme seu e-mail pelo link que enviamos antes de entrar.','User already registered':'Este e-mail já tem conta. Use "Entrar".',
  'email rate limit exceeded':'Muitos e-mails enviados em pouco tempo. Aguarde cerca de uma hora e tente de novo.','Error sending confirmation email':'Não consegui enviar o e-mail de confirmação. Tente de novo mais tarde.',
  'Email address not authorized':'O servidor de e-mail do Bolso ainda não envia para este endereço.','Load failed':'Sem conexão. Confira a internet e tente de novo.','Failed to fetch':'Sem conexão. Confira a internet e tente de novo.'};
function showAuth(mode,msg,opts={}){
  /* No app o endereço é bolso://, que o Supabase não aceita nos links de e-mail: os links abrem no site */
  const back=location.protocol==='bolso:'&&CFG.siteUrl?CFG.siteUrl:location.origin+location.pathname;
  if(S.channel){sb.removeChannel(S.channel);S.channel=null}
  S.user=null;S.months={};S.ready=false;S.authMode=mode;
  $main.hidden=true;showChrome(false);setStatus('loading','Desconectado');$auth.hidden=false;
  const T={login:[tx('Entrar'),tx('Acesse seu controle financeiro.'),tx('Entrar')],signup:[tx('Criar conta'),tx('Use seu e-mail e escolha uma senha com pelo menos 6 caracteres.'),tx('Criar conta')],
    forgot:[tx('Esqueci a senha'),tx('Enviamos um link para você criar uma senha nova.'),tx('Enviar link')],reset:[tx('Nova senha'),tx('Escolha sua nova senha.'),tx('Salvar senha')]}[mode];
  $auth.innerHTML=`<form class="auth" novalidate><h1>${T[0]}</h1><p>${T[1]}</p>
    ${mode!=='reset'?`<label for="email">${tx('E-mail')}</label><input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" required>`:''}
    ${mode!=='forgot'?`<label for="pass">${mode==='reset'?tx('Nova senha'):tx('Senha')}</label><div class="pw"><input id="pass" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" minlength="6" required><button type="button" class="eye" aria-label="${tx('Mostrar senha')}" aria-pressed="false">${EYE.open}</button></div>`:''}
    <button class="btn primary" type="submit">${T[2]}</button>
    <div class="msg" ${msg?'':'hidden'}>${esc(msg||'')}</div>
    ${mode==='login'?`<button type="button" class="switch" id="resend" ${opts.resend?'':'hidden'}>${tx('Reenviar e-mail de confirmação')}</button><button type="button" class="switch" data-mode="signup">${tx('Ainda não tenho conta')}</button><button type="button" class="switch" data-mode="forgot">${tx('Esqueci a senha')}</button>`
      :mode!=='reset'?`<button type="button" class="switch" data-mode="login">${tx('Voltar para entrar')}</button>`:''}
  </form>`;
  $auth.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>showAuth(b.dataset.mode));
  const eye=$auth.querySelector('.eye');
  if(eye)eye.onclick=()=>{const pass=$auth.querySelector('#pass'),show=pass.type==='password';
    pass.type=show?'text':'password';eye.innerHTML=show?EYE.closed:EYE.open;
    eye.setAttribute('aria-label',show?tx('Esconder senha'):tx('Mostrar senha'));eye.setAttribute('aria-pressed',show);pass.focus()};
  $auth.querySelector('form').onsubmit=async e=>{
    e.preventDefault();
    const btn=e.target.querySelector('[type=submit]'),box=e.target.querySelector('.msg');
    const email=$auth.querySelector('#email')?.value.trim(),password=$auth.querySelector('#pass')?.value;
    const resend=$auth.querySelector('#resend');
    const fail=m=>{box.hidden=false;box.className='msg err';box.textContent=/^For security purposes/.test(m)?tx('Aguarde alguns segundos e tente de novo.'):tx(AUTH_ERR[m]||m);btn.disabled=false;
      if(m==='Email not confirmed'&&resend)resend.hidden=false};
    if(mode!=='reset'&&!email)return fail(tx('Digite seu e-mail.'));
    if(mode!=='forgot'&&(!password||password.length<6))return fail(tx('A senha precisa ter pelo menos 6 caracteres.'));
    btn.disabled=true;
    try{
      if(mode==='login'){const r=await sb.auth.signInWithPassword({email,password});if(r.error)return fail(r.error.message)}
      else if(mode==='signup'){const r=await sb.auth.signUp({email,password,options:{emailRedirectTo:back}});if(r.error)return fail(r.error.message);
        /* E-mail já cadastrado: o Supabase responde sem erro, mas não envia nada e devolve identities vazio */
        if(r.data.user?.identities?.length===0)return fail('User already registered');
        if(!r.data.session)showAuth('login',tx('Conta criada. Abra o link que enviamos para {0} e depois entre aqui. Confira também o spam.',email),{email,resend:true})}
      else if(mode==='forgot'){const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:back});if(r.error)return fail(r.error.message);
        showAuth('login',tx('Se o e-mail estiver cadastrado, o link para criar uma senha nova chega em instantes.'))}
      else{const r=await sb.auth.updateUser({password});if(r.error)return fail(r.error.message);toast(tx('Senha alterada.'));startSession(r.data.user)}
    }catch(err){fail(tx('Sem conexão. Confira a internet e tente de novo.'))}
  };
  const emailInput=$auth.querySelector('#email');if(emailInput&&opts.email)emailInput.value=opts.email;
  const resendBtn=$auth.querySelector('#resend');
  if(resendBtn)resendBtn.onclick=async()=>{
    const box=$auth.querySelector('.msg'),email=$auth.querySelector('#email').value.trim();
    const say=(text,err)=>{box.hidden=false;box.className=err?'msg err':'msg';box.textContent=text;resendBtn.disabled=false};
    if(!email)return say(tx('Digite seu e-mail.'),true);
    resendBtn.disabled=true;
    try{const r=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:back}});
      if(r.error){const m=r.error.message;return say(/^For security purposes/.test(m)?tx('Aguarde alguns segundos e tente de novo.'):tx(AUTH_ERR[m]||m),true)}
      say(tx('Enviamos um novo link para {0}. Confira também o spam.',email))
    }catch{say(tx('Sem conexão. Confira a internet e tente de novo.'),true)}
  };
  /* No celular o teclado não sobe sozinho: cobriria a tela e o aviso de instalação */
  if(matchMedia('(hover:hover)').matches)$auth.querySelector('input')?.focus();
}
/* Sair: salva o que estiver pendente (no máximo 4 s) e encerra a sessão mesmo sem internet */
document.getElementById('logout').onclick=async e=>{
  const b=e.currentTarget;b.disabled=true;
  try{await Promise.race([saveNow(),new Promise(r=>setTimeout(r,4000))])}catch{}
  try{const {error}=await sb.auth.signOut();if(error)await sb.auth.signOut({scope:'local'})}catch{try{await sb.auth.signOut({scope:'local'})}catch{}}
  b.disabled=false;showAuth('login',tx('Você saiu da sua conta.'));
};
function touch(id){
  const m=S.months[id];if(m)m.updatedAt=new Date().toISOString();
  S.dirty[id]=true;setStatus('saving');
  clearTimeout(S.timers[id]);S.timers[id]=setTimeout(()=>flush(id),600);
}
async function flush(id){
  if(!S.user)return;
  if(S.saving[id]){S.again[id]=true;return}
  S.saving[id]=true;S.dirty[id]=false;
  try{
    const m=S.months[id];
    const {error}=m?await sb.from('months').upsert({user_id:S.user.id,id,data:m,updated_at:new Date().toISOString()})
      :await sb.from('months').delete().eq('id',id);
    if(error)throw error;
    if(!Object.values(S.dirty).some(Boolean))setStatus('saved');
  }catch(e){
    S.dirty[id]=true;setStatus('error','Erro ao salvar, tentando de novo…');
    clearTimeout(S.timers[id]);S.timers[id]=setTimeout(()=>flush(id),3000);
  }finally{S.saving[id]=false;if(S.again[id]){S.again[id]=false;flush(id)}}
}

/* ---------- Renderização ---------- */
function requestRender(){if($main.contains(document.activeElement)&&document.activeElement.matches('input,select,textarea'))S.pendingRender=true;else render()}
function render(){renderHeader();$main.innerHTML=!S.ready?`<div class="loading">${tx('Carregando seus lançamentos…')}</div>`:S.view==='ano'?yearView():monthView()}
function renderHeader(){
  document.getElementById('ylabel').textContent=S.year;
  const cur=mid(now.getFullYear(),now.getMonth());
  let h=`<button class="tab overview" data-tab="ano" aria-current="${S.view==='ano'}"><span class="n">${tx('Ano {0}',S.year)}</span><span class="v">${tx('visão geral')}</span></button>`;
  for(let i=0;i<12;i++){
    const id=mid(S.year,i),t=totals(S.months[id]);
    const v=t?`<span class="v ${t.balance>=0?'pos':'neg'}" data-tabv="${id}">${brl.format(t.balance)}</span>`:`<span class="v">—</span>`;
    h+=`<button class="tab${id===cur?' now':''}" data-tab="${i}" aria-current="${S.view===i}"><span class="n">${SHORT[i]}</span>${v}</button>`;
  }
  const tabs=document.getElementById('tabs');tabs.innerHTML=h;
  tabs.querySelector('[aria-current="true"]')?.scrollIntoView({block:'nearest',inline:'nearest'});
}
/* Dias até o vencimento da conta no mês aberto (0 = vence hoje); null sem dia definido */
function daysToDue(r){
  const d=parseInt(r.due,10);if(!d||S.view==='ano')return null;
  const last=new Date(S.year,S.view+1,0).getDate(),due=new Date(S.year,S.view,Math.min(d,last));
  const t=new Date();t.setHours(0,0,0,0);return Math.round((due-t)/864e5);
}
const dueSoon=r=>{if(r.paid)return false;const n=daysToDue(r);return n!==null&&n>=0&&n<=3};
function moneyInput(id,val,label){return `<div class="money"><input id="${id}" class="val" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-label="${esc(label)}" value="${val?dec.format(val):''}" data-f="value"></div>`}
function rowHtml(sec,r){
  const p=`${sec.key}-${r.id}`,del=`<button class="del" data-act="del" aria-label="${tx('Remover {0}',esc(r.desc||tx('linha')))}"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>`;
  const desc=`<input id="${p}-desc" class="desc" data-f="desc" value="${esc(r.desc)}" placeholder="${tx('Descrição')}" aria-label="${tx('Descrição')}">`;
  if(sec.kind==='income')return `<div class="row g-income" data-sec="${sec.key}" data-row="${r.id}">${desc}${moneyInput(p+'-v',r.value,tx('Valor'))}${del}</div>`;
  if(sec.kind==='bill')return `<div class="row g-bill${r.paid?' paid':''}${dueSoon(r)?' soon':''}" data-sec="${sec.key}" data-row="${r.id}"><input type="checkbox" class="chk" id="${p}-paid" data-f="paid" ${r.paid?'checked':''} aria-label="${tx('Pago')}">${desc}<label class="duebox" for="${p}-due"><span class="duelbl">${tx('Vence dia')}</span><input id="${p}-due" class="due" data-f="due" inputmode="numeric" maxlength="2" placeholder="—" value="${r.due||''}" aria-label="${tx('Dia do vencimento')}"></label>${moneyInput(p+'-v',r.value,tx('Valor'))}${del}</div>`;
  const cats=CATS.map(c=>`<option value="${c}"${c===r.cat?' selected':''}>${tx(c)}</option>`).join('');
  return `<div class="row g-extra" data-sec="${sec.key}" data-row="${r.id}"><input type="date" id="${p}-date" class="xdate" data-f="date" value="${esc(r.date||'')}" aria-label="${tx('Data')}">${desc}<select id="${p}-cat" class="xcat" data-f="cat" aria-label="${tx('Categoria')}">${cats}</select>${moneyInput(p+'-v',r.value,tx('Valor'))}${del}</div>`;
}
function secHtml(sec,m,t){
  const rows=m[sec.key];
  const head=sec.kind==='income'?`<div class="cols g-income"><span>${tx('Descrição')}</span><span style="text-align:right">${tx('Valor')}</span><span></span></div>`
    :sec.kind==='bill'?`<div class="cols g-bill"><span title="${tx('Pago')}">${tx('Pago')}</span><span>${tx('Descrição')}</span><span style="text-align:center">${tx('Vence')}</span><span style="text-align:right">${tx('Valor')}</span><span></span></div>`
    :`<div class="cols g-extra"><span>${tx('Data')}</span><span>${tx('Descrição')}</span><span>${tx('Categoria')}</span><span style="text-align:right">${tx('Valor')}</span><span></span></div>`;
  const body=rows.length?rows.map(r=>rowHtml(sec,r)).join(''):`<div class="empty-row">${sec.kind==='extra'?tx('Nenhum gasto extra neste mês. Ótimo sinal.'):tx('Nenhum item ainda.')}</div>`;
  return `<section class="sec ${sec.key}"><div class="sec-h"><h2>${sec.title}<small>${sec.hint}</small></h2><span class="tot" data-t="${sec.key}">${brl.format(t[sec.key])}</span></div>${head}<div>${body}</div><button class="add" data-act="add" data-sec="${sec.key}">+ ${sec.add}</button></section>`;
}

function updateTotals(){
  const id=mid(S.year,S.view),t=totals(S.months[id]);if(!t)return;
  $main.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;el.textContent=el.dataset.fmt==='pct'?pct(t[k]):brl.format(t[k])});
  const b=$main.querySelector('[data-t="balance"]');if(b)b.className='big num '+(t.balance>=0?'pos':'neg');
  const base=Math.max(t.income,t.expenses)||1;
  for(const k of ['essential','variable','extras']){const el=$main.querySelector(`[data-bar="${k}"]`);if(el)el.style.width=(t[k]/base*100)+'%'}
  const ps=$main.querySelector('[data-bar="paidShare"]');if(ps)ps.style.width=(t.paidShare*100)+'%';
  const tv=document.querySelector(`[data-tabv="${id}"]`);if(tv){tv.textContent=brl.format(t.balance);tv.className='v '+(t.balance>=0?'pos':'neg')}
}
function yearView(){
  const rows=[];let Y={income:0,expenses:0,extras:0,essential:0,variable:0,balance:0},n=0;
  for(let i=0;i<12;i++){const t=totals(S.months[mid(S.year,i)]);rows.push(t);if(t){n++;for(const k in Y)Y[k]+=t[k]}}
  const max=Math.max(1,...rows.map(t=>t?Math.max(t.income,t.expenses):0));
  const step=niceStep(max/4),top=step*4;
  const W=720,H=250,L=58,B=26,T=10,cw=(W-L-8)/12,bw=Math.min(18,cw/2-4),y=v=>T+(H-T-B)*(1-v/top);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tx('Ganhos e despesas por mês em {0}',S.year)}">`;
  for(let g=0;g<=4;g++){const v=step*g;svg+=`<line class="gl" x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}"/><text class="tx" x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`}
  rows.forEach((t,i)=>{const cx=L+cw*i+cw/2;
    if(t){svg+=`<rect class="bi" x="${cx-bw-1}" y="${y(t.income)}" width="${bw}" height="${Math.max(0,y(0)-y(t.income))}" rx="3"><title>${tx('{0}: ganhos {1}',MONTHS[i],brl.format(t.income))}</title></rect><rect class="be" x="${cx+1}" y="${y(t.expenses)}" width="${bw}" height="${Math.max(0,y(0)-y(t.expenses))}" rx="3"><title>${tx('{0}: despesas {1}',MONTHS[i],brl.format(t.expenses))}</title></rect>`}
    svg+=`<text class="mx" x="${cx}" y="${H-8}" text-anchor="middle">${SHORT[i]}</text>`});
  svg+='</svg>';
  const tr=rows.map((t,i)=>t?`<tr data-tab="${i}"><td>${MONTHS[i]}</td><td>${brl.format(t.income)}</td><td>${brl.format(t.essential)}</td><td>${brl.format(t.variable)}</td><td>${brl.format(t.extras)}</td><td>${brl.format(t.expenses)}</td><td class="${t.balance>=0?'pos':'neg'}">${brl.format(t.balance)}</td></tr>`
    :`<tr class="nodata" data-tab="${i}"><td>${MONTHS[i]}</td><td colspan="6" style="text-align:left;font-family:var(--body)">${tx('Sem lançamentos · clique para abrir')}</td></tr>`).join('');
  return `<div class="mhead"><div><h1>${S.year}</h1><p>${n===1?tx('{0} mês registrado no ano.',n):n?tx('{0} meses registrados no ano.',n):tx('Nenhum mês registrado neste ano ainda. Abra um mês nas abas acima para começar.')}</p></div>${n?`<div class="actions">${exportBtns()}</div>`:''}</div>
  <div class="ycards">
    <div class="card"><div class="lbl">${tx('Ganhos no ano')}</div><div class="big num" style="font-size:24px">${brl.format(Y.income)}</div></div>
    <div class="card"><div class="lbl">${tx('Despesas no ano')}</div><div class="big num" style="font-size:24px">${brl.format(Y.expenses)}</div></div>
    <div class="card"><div class="lbl">${tx('Só gastos extras')}</div><div class="big num" style="font-size:24px;color:var(--c-ext)">${brl.format(Y.extras)}</div></div>
    <div class="card balance"><div class="lbl">${tx('Saldo acumulado')}</div><div class="big num ${Y.balance>=0?'pos':'neg'}" style="font-size:24px">${brl.format(Y.balance)}</div></div>
  </div>
  <div class="card"><div class="lbl" style="display:flex;gap:16px;flex-wrap:wrap"><span>${tx('Ganhos × despesas por mês')}</span><span><i class="dot" style="background:var(--gold)"></i>${tx('Ganhos')}</span><span><i class="dot" style="background:var(--c-ess)"></i>${tx('Despesas')}</span></div><div class="chart">${svg}</div></div>
  <div class="tablewrap"><table><thead><tr><th>${tx('Mês')}</th><th>${tx('Ganhos')}</th><th>${tx('Contas fixas')}</th><th>${tx('Variáveis')}</th><th>${tx('Extras')}</th><th>${tx('Despesas')}</th><th>${tx('Saldo')}</th></tr></thead><tbody>${tr}</tbody>
  <tfoot><tr><td>${tx('Total {0}',S.year)}</td><td>${brl.format(Y.income)}</td><td>${brl.format(Y.essential)}</td><td>${brl.format(Y.variable)}</td><td>${brl.format(Y.extras)}</td><td>${brl.format(Y.expenses)}</td><td class="${Y.balance>=0?'pos':'neg'}">${brl.format(Y.balance)}</td></tr></tfoot></table></div>`;

const money=v=>brl.format(v).replace(/ /g,' ');
const LIBS={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',autotable:'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'};
const libs={};
function loadLib(k){return libs[k]||(libs[k]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[k];s.onload=res;s.onerror=()=>{libs[k]=null;rej(new Error(tx('Não consegui carregar o gerador de arquivo. Verifique a internet.')))};document.head.appendChild(s)}))}
let toastTimer;
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
const MIME={pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
async function saveFile(filename,data){
  const blob=new Blob([data],{type:MIME[filename.split('.').pop()]||'application/octet-stream'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);toast(tx('Baixando {0}',filename));
}
async function saveNow(){
  document.activeElement?.blur?.();
  const ids=Object.keys(S.dirty).filter(k=>S.dirty[k]);
  for(const id of ids){clearTimeout(S.timers[id]);await flush(id)}
  while(Object.values(S.saving).some(Boolean))await new Promise(r=>setTimeout(r,100));
  return !Object.values(S.dirty).some(Boolean);
}
/* Linhas de cada seção no formato [descrição, detalhe, situação, valor] */
function secRows(sec,m){
  return m[sec.key].map(r=>sec.kind==='income'?[r.desc||'—','','',+r.value||0]
    :sec.kind==='bill'?[r.desc||'—',r.due?tx('Dia {0}',r.due):'',r.paid?tx('Pago'):tx('Pendente'),+r.value||0]
    :[r.desc||'—',r.date?r.date.split('-').reverse().join('/'):'',r.cat?tx(r.cat):'',+r.value||0]);
}
const secHead=sec=>sec.kind==='income'?[tx('Descrição'),'','',tx('Valor')]:sec.kind==='bill'?[tx('Descrição'),tx('Vencimento'),tx('Situação'),tx('Valor')]:[tx('Descrição'),tx('Data'),tx('Categoria'),tx('Valor')];
function summaryRows(t){return [[tx('Ganhos'),t.income],[tx('Contas fixas'),t.essential],[tx('Gastos variáveis'),t.variable],[tx('Gastos extras'),t.extras],[tx('Despesas totais'),t.expenses],[tx('Saldo do mês'),t.balance],[tx('Já pago'),t.paid],[tx('Falta pagar'),t.pending],[tx('Reserva de emergência ideal'),t.reserve]]}

function monthSheet(m,name){
  const X=window.XLSX,t=totals(m),aoa=[[`BOLSO · ${name}`],[],[tx('RESUMO')]];
  for(const [k,v] of summaryRows(t))aoa.push([k,'','',v]);
  for(const sec of SECS){aoa.push([],[sec.title.toUpperCase()],secHead(sec),...secRows(sec,m),[tx('Total {0}',sec.title.toLowerCase()),'','',t[sec.key]])}
  if(m.notes)aoa.push([],[tx('ANOTAÇÕES')],[m.notes]);
  const ws=X.utils.aoa_to_sheet(aoa);fmtMoney(ws);ws['!cols']=[{wch:40},{wch:14},{wch:16},{wch:18}];return ws;
}
function fmtMoney(ws){for(const ref in ws){if(ref[0]==='!')continue;const c=ws[ref];if(c.t==='n')c.z='"$"#,##0.00;-"$"#,##0.00'}}
async function exportXlsx(){
  await loadLib('xlsx');const X=window.XLSX,wb=X.utils.book_new();
  if(S.view==='ano'){
    const aoa=[[`BOLSO · ${tx('Resumo {0}',S.year)}`],[],[tx('Mês'),tx('Ganhos'),tx('Contas fixas'),tx('Variáveis'),tx('Extras'),tx('Despesas'),tx('Saldo')]],tot=[0,0,0,0,0,0];
    for(let i=0;i<12;i++){const t=totals(S.months[mid(S.year,i)]);if(!t){aoa.push([MONTHS[i],tx('Sem lançamentos')]);continue}
      const v=[t.income,t.essential,t.variable,t.extras,t.expenses,t.balance];v.forEach((x,j)=>tot[j]+=x);aoa.push([MONTHS[i],...v])}
    aoa.push([tx('Total {0}',S.year),...tot]);
    const ws=X.utils.aoa_to_sheet(aoa);fmtMoney(ws);ws['!cols']=[{wch:16},...Array(6).fill({wch:16})];X.utils.book_append_sheet(wb,ws,tx('Resumo {0}',S.year));
    for(let i=0;i<12;i++){const m=S.months[mid(S.year,i)];if(m)X.utils.book_append_sheet(wb,monthSheet(m,`${MONTHS[i]} ${S.year}`),SHORT[i])}
    return saveFile(`Bolso-${S.year}.xlsx`,X.write(wb,{bookType:'xlsx',type:'array'}));
  }
  const id=mid(S.year,S.view),name=`${MONTHS[S.view]} ${S.year}`;
  X.utils.book_append_sheet(wb,monthSheet(S.months[id],name),MONTHS[S.view]);
  return saveFile(`Bolso-${id}-${MONTHS[S.view]}.xlsx`,X.write(wb,{bookType:'xlsx',type:'array'}));
}

      const v=[t.income,t.essential,t.variable,t.extras,t.expenses,t.balance];v.forEach((x,j)=>tot[j]+=x);body.push([MONTHS[i],...v.map(money)])}
    doc.autoTable({...base,startY:116,head:[[tx('Mês'),tx('Ganhos'),tx('Contas fixas'),tx('Variáveis'),tx('Extras'),tx('Despesas'),tx('Saldo')]],body,foot:[[tx('Total'),...tot.map(money)]],columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}}});
    return saveFile(`Bolso-${S.year}.pdf`,doc.output('arraybuffer'));
  }
  const id=mid(S.year,S.view),m=S.months[id],t=totals(m),right={3:{halign:'right'}};
  doc.autoTable({...base,startY:116,head:[[tx('Resumo do mês'),'']],body:summaryRows(t).map(([k,v])=>[k,money(v)]),columnStyles:{1:{halign:'right',fontStyle:'bold'}},tableWidth:300});
  for(const sec of SECS){

    doc.autoTable({...base,startY:doc.lastAutoTable.finalY+18,head:[[{content:sec.title.toUpperCase(),colSpan:4}],secHead(sec)],
      body:rows.length?rows:[[{content:tx('Nenhum lançamento'),colSpan:4,styles:{textColor:150}}]],foot:[[tx('Total'),'','',money(t[sec.key])]],

  }
  if(m.notes){doc.autoTable({...base,startY:doc.lastAutoTable.finalY+18,head:[[tx('Anotações')]],body:[[m.notes]]})}

async function busy(btn,label,fn){const old=btn.innerHTML;btn.disabled=true;btn.textContent=label;
  try{await fn()}catch(e){toast(e.message||tx('Algo deu errado. Tente de novo.'))}finally{if(btn.isConnected){btn.disabled=false;btn.innerHTML=old}}}

function niceStep(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function short(v){return v>=1000?'$'+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+tx(' mil'):'$'+v}

/* ---------- Ações ---------- */
function setView(v){S.view=v;S.confirm=false;try{localStorage.setItem('bolso-view',JSON.stringify({year:S.year,view:v}))}catch{}render();window.scrollTo({top:0})}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setView(b.dataset.tab==='ano'?'ano':+b.dataset.tab)});
document.getElementById('yprev').onclick=()=>{S.year--;setView(S.view)};
document.getElementById('ynext').onclick=()=>{S.year++;setView(S.view)};

function findRow(el){const row=el.closest('[data-row]');if(!row)return{};const id=mid(S.year,S.view),m=S.months[id];const arr=m?.[row.dataset.sec];return{id,m,arr,r:arr?.find(x=>x.id===row.dataset.row),row}}

  const tr=e.target.closest('tr[data-tab]');if(tr)return setView(+tr.dataset.tab);

  const id=mid(S.year,S.view),act=b.dataset.act;
  if(act==='create'){
    const f=b.dataset.from,m={label:`${MONTHS[S.view]} ${S.year}`,income:[],essential:[],variable:[],extras:[],notes:''};
    if(f==='template')for(const k in TEMPLATE)m[k]=TEMPLATE[k].map(desc=>({id:rid(),desc:tx(desc),value:0,...(k!=='income'?{paid:false,due:''}:{})}));
    else if(S.months[f]){const src=S.months[f];for(const k of ['income','essential','variable'])m[k]=src[k].map(r=>({...r,id:rid(),...(k!=='income'?{paid:false}:{})}))}
    S.months[id]=m;touch(id);flush(id);render();return;
  }
  if(act==='add'){
    const sec=SECS.find(s=>s.key===b.dataset.sec),r={id:rid(),desc:'',value:0};
    if(sec.kind==='bill')Object.assign(r,{paid:false,due:''});
    if(sec.kind==='extra'){const d=new Date();Object.assign(r,{cat:'Outros',date:(d.getFullYear()===S.year&&d.getMonth()===S.view)?d.toISOString().slice(0,10):mid(S.year,S.view)+'-01'})}
    S.months[id][sec.key].push(r);touch(id);render();
    document.getElementById(`${sec.key}-${r.id}-desc`)?.focus();return;
  }
  if(act==='del'){const {arr,r}=findRow(b);if(r){arr.splice(arr.indexOf(r),1);touch(id);render()}return}
  if(act==='save'){busy(b,tx('Salvando…'),async()=>{const ok=await saveNow();
      if(ok){toast(tx('{0} salvo no banco.',MONTHS[S.view]));b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),1500)}
      else toast(tx('Não consegui salvar. Confira a conexão e tente de novo.'))});return}
  if(act==='pdf'){busy(b,tx('Gerando PDF…'),async()=>{await saveNow();await exportPdf()});return}
  if(act==='xlsx'){busy(b,tx('Gerando Excel…'),async()=>{await saveNow();await exportXlsx()});return}
  if(act==='clear-ask'){S.confirm=true;render();return}
  if(act==='clear-no'){S.confirm=false;render();return}
  if(act==='clear-yes'){S.confirm=false;delete S.months[id];S.dirty[id]=true;clearTimeout(S.timers[id]);flush(id);render();return}
});
$main.addEventListener('input',e=>{
  const el=e.target,f=el.dataset.f;if(!f)return;
  const id=mid(S.year,S.view),m=S.months[id];if(!m)return;
  if(f==='notes'){m.notes=el.value;touch(id);return}
  const {r,row}=findRow(el);if(!r)return;
  if(f==='value')r.value=parseMoney(el.value);
  else if(f==='paid'){r.paid=el.checked;row.classList.toggle('paid',el.checked)}
  else if(f==='due'){el.value=el.value.replace(/\D/g,'');r.due=el.value}
  if(f==='paid'||f==='due')row.classList.toggle('soon',dueSoon(r));
  else r[f]=el.value;
  touch(id);updateTotals();
});
$main.addEventListener('change',e=>{if(e.target.dataset.f==='cat'){const {r}=findRow(e.target);if(r){r.cat=e.target.value;touch(mid(S.year,S.view))}}});
$main.addEventListener('focusin',e=>{const el=e.target;if(el.dataset.f==='value'){const {r}=findRow(el);el.value=r&&r.value?String(r.value).replace('.',','):'';el.select()}});
$main.addEventListener('focusout',e=>{const el=e.target;
  if(el.dataset.f==='value'){const {r}=findRow(el);if(r)el.value=r.value?dec.format(r.value):''}
  setTimeout(()=>{if(S.pendingRender&&!($main.contains(document.activeElement)&&document.activeElement.matches('input,select,textarea'))){S.pendingRender=false;render()}},0)});
$main.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.row input')){e.preventDefault();e.target.blur()}});

/* ---------- Conexão ---------- */
addEventListener('offline',()=>{if(S.user)setStatus('error','Sem internet')});
addEventListener('online',()=>{if(!S.user)return;if(!S.ready)return startSession(S.user);
  if(Object.values(S.dirty).some(Boolean))setStatus('saving');else setStatus('saved')});

/* ---------- Instalar na tela de início (PWA) ---------- */
const isNativeApp=location.protocol==='bolso:';
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ua=navigator.userAgent;
const installPlatform=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'ios':/android/i.test(ua)?'android':'desktop';
const SHARE_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
let installEvent=null;
const IBAR_DISMISS='bolso-install-dismissed',DISMISS_DAYS=30;
function installDismissed(){try{return Date.now()-(+localStorage.getItem(IBAR_DISMISS)||0)<DISMISS_DAYS*864e5}catch{return false}}
function renderInstall(){
  const can=!isNativeApp&&!isStandalone()&&(installEvent||installPlatform!=='desktop');
  const bar=document.getElementById('ibar'),show=can&&!installDismissed();
  document.getElementById('appfoot').hidden=!can||show;
  bar.hidden=!show;document.body.classList.toggle('has-ibar',!!show);
  bar.setAttribute('aria-label',tx('Instalar o Bolso'));
  document.getElementById('ibarTitle').textContent=tx('Instale o Bolso');
  document.getElementById('ibarText').textContent=tx('Abra com um toque, direto da tela de início.');
  document.getElementById('ibarInstall').textContent=tx('Instalar');
  document.getElementById('ibarClose').setAttribute('aria-label',tx('Agora não'));
  document.getElementById('footInstall').textContent=tx('Instalar o Bolso na tela de início');
}
function openInstallSheet(platform=installPlatform){
  const steps={
    ios:[tx('Toque em Compartilhar {0} na barra do navegador.',SHARE_ICON),tx('Role a lista e toque em "Adicionar à Tela de Início".'),tx('Toque em "Adicionar" no canto da tela.')],
    android:[tx('Abra o menu ⋮ do navegador.'),tx('Toque em "Instalar app" ou "Adicionar à tela inicial".'),tx('Confirme em "Instalar".')],
    desktop:[tx('Abra o menu do navegador.'),tx('Escolha a opção para instalar o Bolso.')]}[platform];
  const sheet=document.getElementById('isheet');
  sheet.innerHTML=`<h2 id="isheetTitle">${tx('Instale o Bolso')}</h2><p>${tx('Fica na tela de início como um app e abre em tela cheia.')}</p>
    <ol>${steps.map((s,i)=>`<li><span class="step">${i+1}</span><span>${s}</span></li>`).join('')}</ol>
    ${platform==='ios'?`<p class="note">${tx('Se a opção não aparecer, abra este endereço no Safari. Depois de instalar, abra pelo ícone e entre com sua conta.')}</p>`:''}
    <button type="button" class="btn primary" id="isheetOk">${tx('Entendi')}</button>`;
  sheet.querySelector('#isheetOk').onclick=()=>sheet.close();
  sheet.showModal();
}
async function startInstall(){
  if(!installEvent)return openInstallSheet();
  const ev=installEvent;installEvent=null;ev.prompt();
  await ev.userChoice.catch(()=>{});
  renderInstall();
}
document.getElementById('ibarInstall').onclick=startInstall;
document.getElementById('footInstall').onclick=startInstall;
document.getElementById('ibarClose').onclick=()=>{try{localStorage.setItem(IBAR_DISMISS,String(Date.now()))}catch{}renderInstall()};
document.getElementById('isheet').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;renderInstall()});
addEventListener('appinstalled',()=>{installEvent=null;toast(tx('Bolso instalado. Abra pelo ícone na tela de início.'));
  document.getElementById('ibar').hidden=true;document.getElementById('appfoot').hidden=true;document.body.classList.remove('has-ibar')});
if(!isNativeApp&&'serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* Textos fixos do HTML e botão de idioma */
function applyLang(){
  const I=I18N[LANG];document.documentElement.lang=I.locale;
  document.getElementById('langName').textContent=I.name;
  document.getElementById('langCode').textContent=I.code;
  const sel=document.getElementById('lang');sel.value=LANG;sel.setAttribute('aria-label',tx('Idioma'));
  const out=document.getElementById('logout');out.lastChild.textContent=tx('Sair');out.setAttribute('aria-label',tx('Sair da conta'));
  document.getElementById('yprev').setAttribute('aria-label',tx('Ano anterior'));
  document.getElementById('ynext').setAttribute('aria-label',tx('Próximo ano'));
  document.getElementById('tabs').setAttribute('aria-label',tx('Meses'));
  setStatus(...S.status);
  renderInstall();
}
document.getElementById('lang').addEventListener('change',e=>{
  setLang(e.target.value);try{localStorage.setItem('bolso-lang',LANG)}catch{}
  applyLang();
  if($auth.hidden)return render();
  /* Na tela de login, redesenha sem perder o que já foi digitado */
  const email=$auth.querySelector('#email')?.value,pass=$auth.querySelector('#pass')?.value;
  if(S.authMode==='setup')return showSetup();
  showAuth(S.authMode);
  const a=$auth.querySelector('#email'),b=$auth.querySelector('#pass');
  if(a&&email)a.value=email;if(b&&pass)b.value=pass;
});
S.status=['loading','Conectando ao banco…'];applyLang();
$main.querySelector('.loading').textContent=tx('Carregando seus lançamentos…');
renderHeader();
/* Atualiza os destaques de vencimento ao virar o dia */
setInterval(()=>{if(S.ready&&S.view!=='ano')requestRender()},30*60*1000);
initStore().then(()=>{if(S.view!=='ano')updateTotals()});
const _render=render;render=function(){_render();if(S.view!=='ano')updateTotals()};
</script>
</body>
